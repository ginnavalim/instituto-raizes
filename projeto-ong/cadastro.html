<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>
<body>
    <header>
        <p>Instituto Raízes</p>
        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html">Cadastro</a>
        </nav>
    </header>
    <main>
        <h1>Cadastre-se</h1>
        <section>
            <h2>Preencha seus dados</h2>
            <form action="#" method="post">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <p>
                        <label for="nome">Nome completo:</label>
                        <input type="text" name="nome" id="nome" required>
                    </p>
                    <p>
                        <label for="cpf">CPF:</label>
                        <input type="text" name="cpf" id="cpf" 
                        pattern="\d{3}\.\d{3}\.\d{3}-\d{2}"
                        placeholder="000.000.000-00"
                        title="Formato esperado: 000.000.000-00"
                        required>
                    </p>
                    <p>
                        <label for="nascimento">Data de nascimento:</label>
                        <input type="date" name="nascimento" id="nascimento" required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Contato</legend>
                    <p>
                        <label for="email">E-mail:</label>
                        <input type="email" name="email" id="email" required>
                    </p>
                    <p>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" name="telefone" id="telefone"
                        pattern="\(\d{2}\)\s\d{4,5}-\d{4}"
                        placeholder="(00) 00000-0000"
                        title="Formato esperado: (00) 00000-0000"
                        required>
                    </p>
                </fieldset>

                <fieldset>
                    <legend>Endereço</legend>
                    <p>
                        <label for="cep">CEP:</label>
                        <input type="text" name="cep" id="cep" 
                        pattern="\d{5}-\d{3}"
                        placeholder="00000-000"
                        title="Formato esperado: 00000-000"
                        required>
                    </p>
                    <p>
                        <label for="cidade">Cidade:</label>
                        <input type="text" name="cidade" id="cidade" required>
                    </p>
                    <p>
                        <label for="estado">Estado:</label>
                        <input type="text" name="estado" id="estado" required>
                    </p>
                </fieldset>

                <p>
                    <input type="submit" value="Enviar">
                </p>
            </form>
        </section>
    </main>
    <footer>
        <address>
            Instituto Raízes — CNPJ: 12.345.678/0001-90 <br>
            E-mail: contato@institutoraizes.org.br <br>
            Telefone: (11) 1234-5678
        </address>

        <nav aria-label="Redes sociais">
            <a href="#">Instagram</a>
            <a href="#">Facebook</a>
        </nav>

        <p>&copy; 2026 Instituto Raízes. Todos os direitos reservados.</p>
    </footer>
</body>
</html>
